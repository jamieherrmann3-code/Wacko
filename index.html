<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wacko</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-row">
  <button id="newGameBtn" class="new-game">New Game</button>
  <h1 class="game-title">WACKO</h1>
</div>

<div class="toolbar">
  <div class="pattern-picker">
    <span class="pattern-label">Current Pattern:</span>
    <select id="patternSelect" class="pattern-select"></select>
  </div>

  <button id="toggleBallsCountBtn" class="toggle-btn">Show Number of Balls Called</button>
</div>

<div id="board" class="board"></div>

<hr>

<div class="bottom-stats">
  <div class="stat-block">
    <div id="patternPreview" class="pattern-preview">
      <div id="previewGrid" class="preview-grid"></div>
      <div id="previewCaption" class="preview-caption"></div>
    </div>
  </div>
  <div class="stat-block">
    <div>Last Number Called:</div>
    <div id="called" class="stat-display"> </div>
  </div>
  <div class="stat-block" id="ballsCalledBlock">
    <div>Number of Balls Called:</div>
    <div id="ballsCalledCount" class="stat-display">0</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
